<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - TAPT</title>
  <link rel="stylesheet" href="css/themes/default.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Authentication Container -->
  <div class="auth-container">

    <!-- Header Section: Logo, Title, and Subtitle -->
    <header class="auth-header">
      <!-- App Icon Badge -->
      <div class="app-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h1 class="auth-title">Welcome to TAPT</h1>
      <p class="auth-subtitle">Sign in with your GitHub account to continue</p>
    </header>

    <!-- Main Login Card -->
    <main class="login-card">

      <!-- Error Message Container (Hidden when empty) -->
      <div id="login-error" class="error-box" role="alert"></div>

      <!-- GitHub OAuth Sign-In Button -->
      <button type="button" id="github-login-btn" class="github-button">
        <!-- GitHub Vector Icon -->
        <svg class="github-icon" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span class="button-text">Continue with GitHub</span>
      </button>

      <!-- Access Note -->
      <p class="access-note">Access is limited to team members added by an admin.</p>
    </main>

  </div>

</body>
</html>
