<!DOCTYPE html>

  <!-- Main Content Wrapper (offset to the right of sidebar) -->
  <div class="main-wrapper">

    <!-- Top Bar -->
    <header class="top-bar">
      <!-- Page Title -->
      <h1 class="top-bar-title">Tasks</h1>

      <!-- User Information Area -->
      <div class="user-area">
        <!-- User avatar with initials -->
        <div class="user-avatar" title="User Avatar">UN</div>
        <!-- User display name -->
        <span id="user-name" class="user-name">User Name</span>
        <!-- Logout link pointing to login.html -->
        <a href="login.html" id="logout-btn" class="logout-btn">Logout</a>
      </div>
    </header>

    <!-- Page Content Area -->
    <main id="page-content" class="page-content">
      <!-- Empty State Card -->
      <div class="empty-state-card">
        <h2 class="empty-state-title">Tasks</h2>
        <p class="empty-state-message">Content coming soon</p>
      </div>
    </main>

  </div>

</html>
